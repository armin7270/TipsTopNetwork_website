[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83.extensions.gd", "php83.extensions.sqlite3", "php83.extensions.pdo_sqlite", "php83.extensions.pdo_pgsql", "php83.extensions.mbstring", "php83.extensions.bcmath", "php83.extensions.intl", "php83.extensions.zip", "postgresql", "nodejs_22"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction", "npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]
