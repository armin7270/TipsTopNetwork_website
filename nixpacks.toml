[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83.extensions.gd", "php83.extensions.sqlite3", "php83.extensions.pdo_sqlite", "php83.extensions.mbstring", "php83.extensions.bcmath", "php83.extensions.intl", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction", "npm ci"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]
